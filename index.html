<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Pengaturan viewport agar aplikasi tampil pas di layar HP dan tidak bisa di-zoom sembarangan -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Presensi Anak PKL</title>
    
    <!-- Favicon (diperbaiki penutup kutipnya) -->
    <link rel="icon" type="image/png" href="https://iili.io/F0B1fSf.jpg">
    
    <style>
        /* Reset margin dan padding agar tidak ada celah putih di pinggir browser */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah munculnya scrollbar ganda */
            background-color: #f4f6f9; /* Warna latar belakang netral */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Pengaturan Iframe agar memenuhi seluruh jendela browser */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Memuat tautan Google Apps Script Anda ke dalam iframe -->
    <iframe id="frameAbsen" class="active" allow="geolocation" 
            src="https://script.google.com/a/~/macros/s/AKfycbwKfKI_yU9iY3WxSMNCQ7vKN-CnWsJHlqRjV3WLNb_8EeK1hUJY9v-jJ4eNgd5kd2GM/exec"></iframe>

</body>
</html>
